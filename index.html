<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>피트월 그랑프리</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}[hidden]{display:none!important}body{margin:0;font-size:14px}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Saira+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: 중계 그래픽. 왼쪽 타이밍 타워 + 트랙 지도 + 하단 피트월 콘솔. 강조색은 플레이어의 팀 색이 맡는다. */
:root{
  color-scheme:dark;
  --bg:#0b0f16; --panel:#1f2835; --panel2:#2d3847; --line:#465468; --fg:#f2f4f8; --mute:#aeb9c9;
  --team:#ef3340; --team-ink:#fff; --team2:#f2f4f7;
  --purple:#c56bff; --green:#37e07c; --flag:#ffc61a; --danger:#ff4a55; --rain:#4aa8ff;
  --disp:'Saira Condensed','IBM Plex Sans KR',system-ui,sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--flag);outline-offset:1px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
#app{height:100%}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
.scroll{height:100%;overflow-y:auto}
.lab{font:600 12px/1.2 var(--disp);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
.btn{min-height:44px;padding:0 18px;font:700 15px var(--body);background:var(--panel2);border:1px solid var(--line);border-radius:2px}
.btn:hover:not(:disabled){border-color:var(--mute)}
.btn.pri{background:var(--team);color:var(--team-ink);border-color:var(--team);clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);padding-right:30px}
.btn:disabled{opacity:.45}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec>h2{font:800 20px/1.2 var(--disp);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.sec>h2::before{content:"";width:5px;height:16px;background:var(--team);transform:skewX(-14deg)}
.note{color:var(--mute);font-size:13px}
.ty{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:3px solid;font:800 11px/1 var(--disp);flex:none;background:#0d1016}
.ty-S{border-color:#ff3b47;color:#ff8a92}.ty-M{border-color:#ffd23f;color:#ffe48a}.ty-H{border-color:#f2f4f7;color:#fff}.ty-W{border-color:#3aa0ff;color:#8ecbff}
.tick{display:inline-block;width:4px;height:14px;transform:skewX(-14deg);flex:none}

/* 창단 */
.create-hero{position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#141923 0 58px,#111620 58px 116px);border-bottom:3px solid var(--team);padding:18px 16px 12px;display:grid;gap:4px}
.create-hero h1{font:800 clamp(38px,8vw,72px)/.95 var(--disp);letter-spacing:.01em}
.create-hero p{color:var(--mute);max-width:46ch}
.car-prev{max-width:520px;width:100%;margin:6px 0 0 auto}
.car-prev svg{display:block;width:100%;height:auto}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input{height:44px;background:var(--panel);border:1px solid var(--line);padding:0 10px;border-radius:2px;width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:32px;height:32px;border:2px solid var(--line);border-radius:2px}
.sw[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--bg) inset}
.budget{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--panel);padding:10px 12px}
.budget b{font:800 24px var(--disp)}
.drv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.drv{display:grid;gap:8px;padding:12px;background:var(--panel);border:1px solid var(--line);text-align:left;border-radius:2px;min-width:0}
.drv[aria-pressed=true]{border-color:var(--team);background:color-mix(in srgb,var(--team) 14%,var(--panel))}
.drv-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.drv-top strong{font-size:15px}
.drv-top .num{font-size:18px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{display:grid;gap:1px}.stat span{font-size:11px;color:var(--mute)}.stat b{font:700 17px var(--disp);font-variant-numeric:tabular-nums}

/* 본부 */
.hub-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--team);padding-bottom:10px}
.hub-head h1{font:800 clamp(26px,5vw,40px)/1.05 var(--disp)}
.money{text-align:right}.money b{font:800 28px/1 var(--disp);font-variant-numeric:tabular-nums}
.hub-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
@media (max-width:860px){.hub-grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.next{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:14px;background:var(--panel);padding:14px;align-items:center}
@media (max-width:520px){.next{grid-template-columns:minmax(96px,122px) minmax(0,1fr);gap:10px;padding:10px}.next h3{font-size:20px}}
.next svg{width:100%;height:auto;display:block}
.next h3{font:800 24px/1.1 var(--disp)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-block:8px 12px}
.chip{font-size:12px;padding:1px 7px;background:var(--panel2);color:#cdd5e1;border-radius:2px}
.cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.cal div{height:34px;background:var(--panel);display:grid;place-items:center;font:700 13px var(--disp);color:var(--mute);font-variant-numeric:tabular-nums}
.cal .done{color:var(--fg)}.cal .pts{background:var(--team);color:var(--team-ink)}.cal .now{outline:2px solid var(--flag);outline-offset:-2px;color:var(--flag)}
.news{display:grid;gap:4px;background:var(--panel);padding:10px 12px;font-size:13px}
.news .good{color:var(--green)}.news .bad{color:var(--danger)}
.part{display:grid;gap:8px;padding:12px;background:var(--panel)}
.part-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.part-top strong{font-size:15px}.part-top b{font:800 22px/1 var(--disp);font-variant-numeric:tabular-nums}
.meter{position:relative;height:7px;background:var(--panel2)}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--team)}
.meter em{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
.meter u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--mute)}
.proj{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.proj button{padding:8px;background:var(--panel2);border:1px solid var(--line);text-align:left;font-size:12px;line-height:1.35;border-radius:2px;color:#cdd5e1}
.proj button strong{display:block;color:var(--fg);font-size:13px}
.proj button:hover:not(:disabled){border-color:var(--team)}
.proj button:disabled{opacity:.45}
.busy{font-size:13px;color:var(--flag);padding:8px;background:var(--panel2)}
table{border-collapse:collapse;width:100%}
.tbl td,.tbl th{padding:5px 8px;border-bottom:1px solid #35414f;text-align:left;font-size:13px;white-space:nowrap}
.tbl th{font:600 12px var(--disp);letter-spacing:.08em;color:var(--mute)}
.tbl .r{text-align:right;font-family:var(--disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.tbl tr.me td{background:color-mix(in srgb,var(--team) 20%,transparent);font-weight:700}
.tblw{overflow-x:auto;background:var(--panel)}
.nm{overflow:hidden;text-overflow:ellipsis;max-width:190px}

/* 경기 전 */
.pre-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:760px){.pre-grid{grid-template-columns:minmax(0,1fr)}}
.tyre-pick{background:var(--panel);padding:12px;display:grid;gap:10px}
.tyre-pick .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tp{display:grid;justify-items:center;gap:3px;padding:8px 4px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:#cdd5e1;border-radius:2px}
.tp[aria-pressed=true]{border-color:#fff;color:#fff}
.grid-list{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;background:var(--panel);padding:10px}
.gr{display:flex;align-items:center;gap:6px;font:600 15px var(--disp);padding:1px 4px;min-width:0}
.gr .p{width:20px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.gr.me{background:color-mix(in srgb,var(--team) 24%,transparent)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* 경기 */
.race{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top top" "tower map" "tower radio" "tower ctrl";gap:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px}
.top{grid-area:top;display:flex;align-items:center;gap:10px;background:var(--panel);padding:4px 8px;min-width:0}
.top{position:relative;padding-bottom:9px!important}
.lapbox{display:grid;gap:1px;white-space:nowrap;flex:none}
.lapnow{font:800 24px/1 var(--disp);font-variant-numeric:tabular-nums}
.lapnow b{display:inline-block;font-size:28px;font-weight:800;color:var(--fg)}
.lapnow b.tick2{animation:lapPop .45s ease-out}
.lapnow span{font-family:var(--body);font-size:14px;font-weight:700;margin-left:1px}
.lapleft{font-size:12px;line-height:1.2;color:#cdd5e1;font-weight:500}
.lapleft.last{color:var(--flag);font-weight:700}
@keyframes lapPop{0%{transform:scale(1.35);color:var(--flag)}100%{transform:scale(1)}}
.lapbar{position:absolute;left:0;right:0;bottom:0;height:5px;display:grid;gap:1px;background:#0a0d13}
.lapbar i{background:#343e4e}.lapbar i.on{background:var(--team)}.lapbar i.cur{background:var(--flag)}
.flag{display:grid;gap:2px;font-size:12px;font-weight:700;line-height:1.1;padding:4px 8px;background:var(--panel2);white-space:nowrap;flex:none}
.flag small{font-size:11.5px;font-weight:500;color:#cdd5e1}.flag small.hi{color:var(--rain);font-weight:700}
.flag.sc small,.flag.rain small{color:inherit}
.flag.sc{background:var(--flag);color:#141006}.flag.rain{background:var(--rain);color:#061423}.flag.end{background:#fff;color:#000}
.track-nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute);font-size:12px}
.speed{display:flex;gap:2px;flex:none}
.speed button{width:36px;height:34px;background:var(--panel2);font:700 13px var(--disp);color:var(--mute)}
.speed button[aria-pressed=true]{background:#fff;color:#000}
.tower{grid-area:tower;background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.tw-head{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:var(--panel2)}
.tw-head button{font:600 12px var(--disp);letter-spacing:.06em;color:var(--mute);padding:3px 0}
.tw-list{flex:1;overflow-y:auto;min-height:0}
.tw{display:grid;grid-template-columns:22px 6px 44px minmax(0,1fr) 24px 34px;gap:6px;align-items:center;height:26px;padding:0 8px;font:600 15px/1 var(--disp);font-variant-numeric:tabular-nums;border-bottom:1px solid #2f3a48}
.tw.me{background:color-mix(in srgb,var(--team) 26%,transparent);font-weight:800}
.tw.out{opacity:.45}
.tw .p{color:var(--mute);text-align:right}.tw.me .p{color:var(--fg)}
.tw .g{text-align:right;color:#cdd5e1;font-size:14px;white-space:nowrap}
.tw .w{text-align:right;font-size:13px;color:var(--mute)}
.tw .w.hot{color:var(--danger)}
.tw .fl{color:var(--purple)}
.tw .ty{width:18px;height:18px;border-width:2px;font-size:10px}
.mapbox{grid-area:map;position:relative;min-height:0;min-width:0;overflow:hidden;background:radial-gradient(ellipse at center,#141a25,#0b0e14)}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{touch-action:none;cursor:grab}#hud:active{cursor:grabbing}
.mini{position:absolute;right:8px;top:8px;width:190px;height:166px;background:rgba(8,11,17,.72);pointer-events:none}
.mapbox.flat .mini{inset:0;width:100%;height:100%;background:none}
.ptbar{position:absolute;left:8px;top:8px;width:min(250px,calc(100% - 136px));background:rgba(8,11,17,.82);padding:5px 8px 6px;pointer-events:none;display:grid;gap:3px}
.ptrow{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px}.ptrow b{font:800 17px/1 var(--disp);font-variant-numeric:tabular-nums}
.ptm{height:6px;background:#2a3342}.ptm i{display:block;height:100%;background:var(--team)}
.callout{position:absolute;left:50%;top:22%;transform:translateX(-50%) skewX(-8deg);padding:7px 18px;background:var(--team);color:var(--team-ink);font:800 clamp(18px,3.6vw,30px)/1.1 var(--disp);white-space:nowrap;pointer-events:none;z-index:2}
.callout.sc{background:var(--flag);color:#141006}.callout.pit{background:#fff;color:#000}.callout.bad{background:var(--danger);color:#fff}.callout.end{background:#fff;color:#000}
.fcard{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:10px;background:rgba(8,11,17,.82);padding:6px 10px;font-size:12px;pointer-events:none;white-space:nowrap}
.fcard b{font:800 17px/1 var(--disp)}
.cams{position:absolute;right:8px;bottom:8px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:calc(100% - 16px);z-index:3}
.camset{display:flex;gap:1px}
.cams button{height:34px;padding:0 10px;background:rgba(8,11,17,.86);font-size:12px;font-weight:500;color:#dce2ec}
.cams button[aria-pressed=true]{background:#fff;color:#000;font-weight:700}
.lights{position:absolute;left:0;right:0;top:16%;display:grid;place-items:center;pointer-events:none}
.lights div{display:flex;gap:10px;padding:10px 12px;background:rgba(7,9,13,.88)}
.lights i{width:clamp(26px,6vw,46px);aspect-ratio:1;border-radius:50%;background:#20262f;display:block}
.lights i.on{background:#ff1e2a;box-shadow:0 0 18px #ff1e2a}
.radio{grid-area:radio;position:relative;background:var(--panel);padding:7px 10px 8px;display:flex;gap:8px;align-items:center;min-height:50px;overflow:hidden}
.radio .tag{font:800 12px var(--disp);letter-spacing:.08em;color:var(--team);flex:none;align-self:flex-start;padding-top:2px}
.radio p{flex:1;font-size:13px;line-height:1.4;min-width:0}
.radio.urgent{background:#2a2108}.radio.urgent .tag{color:var(--flag)}
.radio .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--flag)}
.ctrl{grid-area:ctrl;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.dp{background:var(--panel);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dp.out{opacity:.5}
.dp-h{display:flex;align-items:center;gap:6px;font:800 17px/1 var(--disp);min-width:0}
.dp-h .pos{color:var(--fg)}.dp-h .gap{margin-left:auto;font-weight:600;font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.dp-t{display:flex;align-items:center;gap:6px}
.bar{flex:1;height:8px;background:var(--panel2);min-width:0;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--green)}
.pct{font:700 14px var(--disp);width:34px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.seg button{height:34px;background:var(--panel2);font-size:12px;font-weight:500;color:#cdd5e1}
.seg button[aria-pressed=true]{background:var(--team);color:var(--team-ink);font-weight:700}
.box{height:40px;background:#23160a;border:1px solid #6b4a1b;color:#ffc98a;font:800 16px var(--disp);letter-spacing:.08em}
.box.armed{background:var(--flag);border-color:var(--flag);color:#141006}
.box.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{background:#5a3c10}}
.tchips{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;height:40px}
.tchips button{background:var(--panel2);display:grid;place-items:center}
.order{grid-column:1/-1;height:34px;background:var(--panel);font-size:12px;font-weight:500;border:1px solid var(--line)}
.order:disabled{color:#667184;opacity:1}
.order:not(:disabled){border-color:var(--team)}
.finbtn{flex:none}
@media (max-width:760px),(max-height:520px) and (max-width:760px){
  .race{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(170px,1fr) auto auto auto;grid-template-areas:"top" "map" "radio" "tower" "ctrl";gap:4px}
  .track-nm{display:none}.top{justify-content:space-between}
  .tw{height:22px}
  .tw-list{height:110px;overflow:hidden;flex:none}
  .tw-head{display:none}
  .mini{width:92px;height:80px;right:6px;top:6px}
  .ptbar{left:6px;top:6px;width:calc(100% - 110px);max-width:210px}
  .fcard{display:none}
  .cams{right:4px;left:4px;bottom:4px;max-width:none;justify-content:space-between}
  .cams button{height:30px;padding:0 8px}
  .camset button{padding:0 9px}
  #sndBtn{font-size:11px}
  .dp{padding:6px;gap:4px}.seg button{height:30px}.box{height:36px}.tchips{height:36px}.order{height:30px}
  .radio{min-height:44px;padding:5px 8px 6px}.radio p{font-size:12.5px}
  .tower{min-height:0}
}
@media (min-width:761px) and (max-width:1000px){.race{grid-template-columns:240px minmax(0,1fr)}}
.race.fs{position:fixed;inset:0;z-index:30;display:block;padding:0;background:#000}
.race.fs .mapbox{position:absolute;inset:0}
.race.fs .top{position:absolute;left:max(6px,env(safe-area-inset-left,0px));right:max(6px,env(safe-area-inset-right,0px));top:calc(4px + env(safe-area-inset-top,0px));background:rgba(8,11,17,.82);z-index:4}
.race.fs .tower{position:absolute;left:max(6px,env(safe-area-inset-left,0px));top:calc(116px + env(safe-area-inset-top,0px));width:230px;bottom:70px;background:rgba(8,11,17,.76);z-index:3}
.race.fs .tw{grid-template-columns:20px 5px 38px minmax(0,1fr) 20px 26px;height:22px;font-size:14px;padding:0 5px;gap:4px}
.race.fs .tw-list{height:auto;overflow:auto;flex:1}
.race.fs .ptbar{top:calc(66px + env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px))}
.race.fs .mini{top:calc(66px + env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px))}
.race.fs .radio{position:absolute;left:max(6px,env(safe-area-inset-left,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 12px));background:rgba(12,16,23,.88);z-index:4;min-height:42px}
.race.fs .radio.urgent{background:rgba(42,33,8,.94)}
.race.fs .ctrl{display:none;position:absolute;left:max(6px,env(safe-area-inset-left,0px));right:max(6px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;max-width:760px;margin-inline:auto}
.race.fs.con-open .ctrl{display:grid}
.race.fs .dp,.race.fs .order{background:rgba(14,18,26,.94)}
.race.fs .cams{right:max(8px,env(safe-area-inset-right,0px));left:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));justify-content:flex-end}
.race.fs .fcard{display:none}
@media (max-width:760px),(max-height:480px){
  .race.fs .tower{display:none}
  .race.fs .radio{bottom:calc(44px + env(safe-area-inset-bottom,0px))}
  .race.fs .cams{left:max(6px,env(safe-area-inset-left,0px));justify-content:space-between}

function buildTrack(T){
  if(T.geo)return T.geo;
  const P=T.pts,n=P.length,raw=[];
  for(let i=0;i<n;i++){
    const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    for(let k=0;k<24;k++){const t=k/24,t2=t*t,t3=t2*t;
      raw.push([.5*(2*p1[0]+(p2[0]-p0[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(3*p1[0]-p0[0]-3*p2[0]+p3[0])*t3),
                .5*(2*p1[1]+(p2[1]-p0[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(3*p1[1]-p0[1]-3*p2[1]+p3[1])*t3)]);}
  }
  const N=raw.length,seg=[];let L=0;
  for(let i=0;i<N;i++){const a=raw[i],b=raw[(i+1)%N],d=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push(d);L+=d}
  let area=0;for(let i=0;i<N;i++){const a=raw[i],b=raw[(i+1)%N];area+=a[0]*b[1]-b[0]*a[1]}
  // 곡률 기반 속도 → 시간 비율 → 지점 인덱스 표
  const spd=[];for(let i=0;i<N;i++){const a=raw[(i-3+N)%N],b=raw[i],c=raw[(i+3)%N];
    const u=Math.atan2(b[1]-a[1],b[0]-a[0]),v=Math.atan2(c[1]-b[1],c[0]-b[0]);let d=Math.abs(v-u);if(d>Math.PI)d=2*Math.PI-d;
    spd.push(1/(1+d*3.2))}
  const tm=[0];let tt=0;for(let i=0;i<N;i++){tt+=seg[i]/spd[i];tm.push(tt)}
  const M=1200,map=new Float32Array(M+1);let j=0;
  for(let m=0;m<=M;m++){const target=m/M*tt;while(j<N-1&&tm[j+1]<target)j++;const r=(target-tm[j])/Math.max(1e-6,tm[j+1]-tm[j]);map[m]=j+clamp(r,0,1)}
  return T.geo={pts:raw,N,map,M,inward:area>0?1:-1};
}
function at(geo,frac){
  const f=((frac%1)+1)%1,m=f*geo.M,i=Math.floor(m),idx=geo.map[i]+(geo.map[Math.min(i+1,geo.M)]-geo.map[i])*(m-i);
  const a=Math.floor(idx)%geo.N,b=(a+1)%geo.N,r=idx-Math.floor(idx),p=geo.pts[a],q=geo.pts[b];
  const dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy)||1;
  return {x:p[0]+dx*r,y:p[1]+dy*r,nx:-dy/len*geo.inward,ny:dx/len*geo.inward};
}

function preparePre(T){
  const entries=[];
  G.ai.forEach(t=>t.drivers.forEach(d=>entries.push({d,team:t,perf:perfOf(t,T)})));
  const techB=(G.tech.fast&&T.w[0]>=.5?2:0)+(G.tech.slow&&T.w[2]>=.45?2:0);
  G.drivers.forEach(d=>entries.push({d,team:{n:G.team.name,c:G.team.c1,id:'me',chassis:G.car.chassis,dur:G.car.dur},perf:perfOf(G.car,T)+techB,mine:true}));
  entries.forEach(e=>e.q=(92-e.perf)*.05+(90-e.d.pace)*.03+rand(-.28,.28)-(e.mine?G.fac.sim*.06:0));
  entries.sort((a,b)=>a.q-b.q);
  const rp=clamp(T.rain*((G.rainMod||[])[TRACKS.indexOf(T)]||1)*((G.rule&&G.rule.rain)||1),.02,.8);
  const rainy=Math.random()<rp;
  const plan=rainy?{start:irand(3,T.laps-5),dur:irand(3,10),target:rand(.5,.95)}:null;
  const fc=clamp(Math.round((rainy?Math.max(rp,.35):rp*.8)*100+rand(-10,12)),0,90);
  P={T,grid:entries,plan,forecast:fc,falseRain:!rainy&&Math.random()<rp*.5?irand(4,T.laps-5):0,rainP:rp,tyres:['M','M']};
}
function makeRace(P,auto){
  const T=P.T;buildTrack(T);
  const cars=P.grid.map((e,i)=>({d:e.d,team:e.team,perf:e.perf,mine:!!e.mine,grid:i+1,dist:-(i+1)*.0042,lap:0,tyre:'M',wear:0,used:new Set(),mode:'normal',pitReq:null,pit:null,lt:T.base,speed:0,lastLap:0,best:0,lapStart:0,dnf:false,done:false,noise:0,passUntil:0,nextTry:0,slowUntil:0,yieldUntil:0,startDelay:rand(0,.5)+(100-e.d.mental)*.006,plan:rand(62,84),pits:0,warned:0,id:i}));
  let mi=0;
  cars.forEach(c=>{
    if(c.mine&&!auto){c.tyre=P.tyres[G.drivers.findIndex(d=>d.id===c.d.id)];mi++}
    else{const r=Math.random();c.tyre=r<.25?'S':r<.75?'M':'H'}
    c.used.add(c.tyre);
  });
  return {track:T,cars,mine:cars.filter(c=>c.mine),laps:T.laps,t:0,wet:0,wetT:0,sc:null,scCount:0,leaderLap:0,chequered:false,finished:false,fast:null,plan:P.plan,falseRain:P.falseRain,auto,fc:P.forecast,rainP:P.rainP,rainWas:false,autoPilot:false,msg:null,slowUntil:0,scale:7,wetCalled:false,dryCalled:false,scripted:Math.random()<.5?irand(4,T.laps-5):0,orderCd:0,ordAsk:0,rainNow:false,log:[]};
}
function radio(R,text,urgent){R.msg={text,urgent:!!urgent,at:performance.now()};if(urgent&&!R.auto&&!R.autoPilot)R.slowUntil=performance.now()+8000}
function calcLap(c,R){
  const T=R.track,d=c.d,wet=R.wet;
  let lt=T.base+(92-c.perf)*.05+(90-d.pace)*.028;
  if(c.tyre==='W')lt+=1.2+Math.max(0,.5-wet)*9.6;else lt+=TYRES[c.tyre].off+Math.pow(wet,1.3)*16;
  const w=c.wear/100;lt+=w*w*3.2+Math.max(0,c.wear-85)*.22;
  lt+=wet*3.5-(d.wet-75)*.06*wet;
  if(c.mine&&G.tech.wet)lt-=wet*.6;
  lt+=MODE[c.mode].t;
  lt+=Math.max(0,R.laps-Math.max(c.lap,0))*.035;
  lt+=c.noise;
  if(c.mine&&d.morale<70)lt+=(70-d.morale)*.006;
  if(c.punct)lt+=12;
  if(c.yieldUntil>R.t)lt+=1.2;
  return lt;
}
function pickDry(c,R){
  const rem=R.laps-c.lap,need=!c.used.has('W')&&c.used.size<2;
  for(const t of ['S','M','H']){
    if(need&&c.used.has(t))continue;
    if(rem*TYRES[t].w*R.track.wear<92)return t;
  }
  return need&&c.used.has('H')?'M':'H';
}
function aiDecide(c,R){
  const rem=R.laps-c.lap,wet=R.wet;
  if(c.wear>72)c.mode='manage';else if(rem<5&&c.wear<60)c.mode='attack';else c.mode='normal';
  if(c.pitReq||rem<1)return;
  if(c.tyre!=='W'&&wet>.34&&Math.random()<.3+c.d.mental*.003){c.pitReq='W';return}
  if(c.tyre==='W'&&wet<.2&&rem>1&&Math.random()<.5){c.pitReq=pickDry(c,R);return}
  if(c.tyre==='W'||wet>.3)return;
  const need=!c.used.has('W')&&c.used.size<2;
  if(R.sc&&rem>2&&c.wear>25&&Math.random()<.7){c.pitReq=pickDry(c,R);return}
  if(need&&rem<=2){c.pitReq=pickDry(c,R);return}
  if(rem<=2)return;
  if(c.wear>=c.plan){c.pitReq=pickDry(c,R);c.plan=rand(66,88)}
}
function startPit(c,R){
  const T=R.track,cl=c.mine?G.fac.crew:0,crew=Math.random()<(c.mine?.1-.025*cl:.06)?rand(3,6):0,stop=rand(2.2,3)+crew+(c.mine?.4-.2*cl:0);
  const newT=c.pitReq;c.pitReq=null;
  const D=PF*T.base+T.pit+((G.rule&&G.rule.pit)||0)+stop;
  c.pit={left:D,D,rate:PF/D,tyre:newT,stop,crew};c.lastStop=stop;
  c.pits++;
}
function doIncident(c,R){
  const inc=c.incident;c.incident=null;
  if(c.dnf||c.done||c.pit)return;
  if(inc.type==='slow'){
    const loss=rand(2,6);c.slowUntil=R.t+loss;
    if(c.mine)radio(R,`${c.d.code}: 코너에서 잠겼습니다. 약 ${(loss/2).toFixed(0)}초 잃었습니다.`);
    return;
  }
  c.dnf=true;c.dnfWhy=inc.type==='crash'?'사고':'고장';
  const rem=R.laps-R.leaderLap;
  if(c.mine)radio(R,`${c.d.code} 리타이어. ${inc.type==='crash'?'방호벽에 부딪혔습니다. 드라이버는 무사합니다.':'파워 유닛이 멈췄습니다.'}`,false);
  const chance=inc.type==='crash'?.7:.2;
  if(!R.sc&&R.scCount<2&&rem>2&&Math.random()<chance){
    R.sc={end:R.leaderLap+irand(2,3)};R.scCount++;
    const normal=R.track.pit+2.5,now=Math.round(normal*.55);
    radio(R,`세이프티카 출동 (${c.d.code} ${c.dnfWhy}). 지금 들어오면 피트 손실이 ${Math.round(normal)}초에서 약 ${now}초로 줄어듭니다. BOX 할까요?`,true);
  }else if(!c.mine&&!R.sc){
    radio(R,`${c.d.code} 리타이어. 노란 깃발 구간은 곧 정리됩니다.`);
  }
}
function updateForecast(R){

function ensureG(g){
  if(!g)return g;
  recolorAI(g);
  g.season=g.season||1;g.history=g.history||[];g.career=Object.assign({wins:0,podiums:0,points:0,titles:0,drvTitles:0,races:0},g.career||{});

const maxSlots=()=>2+(G.fac.shop>=3?1:0);
function projInfo(part,kind){
  const m=projMeta[kind],fl=part==='aero'?G.fac.wind:part==='engine'?G.fac.bench:0;
  let delay=m.delay;if(kind==='bold'&&G.fac.shop>=2)delay=1;
  const v=G.car[part],dim=v<78?1:v<84?.78:v<89?.58:v<93?.36:.2,gain=Math.max(.5,Math.round((m.gain+fl)*dim*2)/2);
  return {n:m.n,cost:projCost(part,kind)+Math.round(Math.max(0,v-70)*.55),odds:Math.min(100,m.odds+fl*8),gain,fail:Math.min(m.fail,gain),delay};
}
function buyProject(part,kind){
  const p=projInfo(part,kind);
  if(G.budget<p.cost||G.projects.length>=maxSlots()||G.projects.some(x=>x.part===part))return false;
  const ok=Math.random()*100<p.odds;
  G.budget-=p.cost;G.devCount[part]++;G.projects.push({part,kind,ok,gain:ok?p.gain:p.fail,due:G.round+p.delay});save();return true;
}
function buyFacility(k){const L=G.fac[k];if(L>=3)return false;const c=FACS[k].cost[L];if(G.budget<c)return false;G.budget-=c;G.fac[k]=L+1;save();return true}
function buyTech(id){const t=TECHS.find(x=>x.id===id);if(G.tech[id]||G.budget<t.cost||G.car[t.req[0]]<t.req[1])return false;G.budget-=t.cost;G.tech[id]=true;save();return true}

const TEAM_PRIZE=[110,92,78,66,56,48,42,36,30,26],OPERATING=25,MIN_BUDGET=40;
const RULES=[

function allDrivers(g){return [...g.drivers,...g.ai.flatMap(t=>t.drivers)]}
function makeRookie(g,top){
  const used=new Set(allDrivers(g).map(d=>d.code));if(g.off&&g.off.market)g.off.market.forEach(d=>used.add(d.code));
  const given=R_GIVEN[irand(0,R_GIVEN.length-1)];let fam=R_FAMILY[irand(0,R_FAMILY.length-1)];
  for(let i=0;i<R_FAMILY.length&&used.has(fam[1]);i++)fam=R_FAMILY[(R_FAMILY.indexOf(fam)+1)%R_FAMILY.length];
  g.rookieN=(g.rookieN||0)+1;
  const ko=/[가-힣]/.test(given)?R_KO[fam[0]]+given:(R_KO[given]||given)+' '+R_KO[fam[0]];
  return {id:'r'+g.season+'_'+g.rookieN,n:ko,code:fam[1],age:irand(18,21),pace:irand(top?68:63,top?76:72),tyre:irand(54,76),wet:irand(54,80),mental:irand(52,74),contract:irand(1,3),rookie:true};
}
function driverValue(d){return Math.round(clamp((d.pace-62)*2.1+(d.tyre+d.wet+d.mental-195)*.3,6,95))}
function driverTag(d){return d.age<=22?'신인':d.age<=26?'유망주':d.age<=32?'주전급':'베테랑'}
function ageDriver(d){
  const before={pace:d.pace,tyre:d.tyre,wet:d.wet,mental:d.mental};d.age=(d.age||26)+1;
  const a=d.age,cap=v=>clamp(Math.round(v),40,99);
  if(a<=23){d.pace=cap(d.pace+rand(.5,3.2));d.tyre=cap(d.tyre+rand(0,3));d.wet=cap(d.wet+rand(0,3));d.mental=cap(d.mental+rand(.5,3.5))}
  else if(a<=30){d.pace=cap(d.pace+rand(-.6,1.2));d.tyre=cap(d.tyre+rand(-.3,1.4));d.wet=cap(d.wet+rand(-.3,1.4));d.mental=cap(d.mental+rand(0,1.5))}
  else if(a<=34){d.pace=cap(d.pace+rand(-1.8,.2));d.tyre=cap(d.tyre+rand(-.4,.8));d.wet=cap(d.wet+rand(-.6,.6));d.mental=cap(d.mental+rand(0,.8))}
  else{d.pace=cap(d.pace+rand(-3.4,-.8));d.tyre=cap(d.tyre+rand(-1.5,.2));d.wet=cap(d.wet+rand(-1.5,.2));d.mental=cap(d.mental+rand(-.5,.5))}
  d.delta={pace:d.pace-before.pace,tyre:d.tyre-before.tyre,wet:d.wet-before.wet,mental:d.mental-before.mental};
}
function settleSeason(){
  if(G.off)return;
  const st=standings(),rank=st.findIndex(t=>t.id==='me')+1,pts=G.pts.me||0,ds=driverStandings(),dch=ds[0],prev=G.prevRank||10;
  const prize=TEAM_PRIZE[rank-1],hit=G.target&&rank<=G.target,tBonus=hit?20:0,first=rank===1&&!G.career.titles,fBonus=first?50:0;
  const best=G.results.length?Math.min(...G.results.map(r=>r.best)):99;
  G.career.titles+=rank===1?1:0;if(dch.me)G.career.drvTitles++;
  G.history.push({season:G.season,team:G.team.name,rank,pts,best,drv:dch.n,drvMe:!!dch.me,champ:st[0].n});
  G.budget=G.budget+prize+tBonus+fBonus-OPERATING;
  const aid=G.budget<MIN_BUDGET?MIN_BUDGET-G.budget:0;G.budget+=aid;
  const off={step:'result',rank,prevRank:prev,pts,prize,tBonus,fBonus,target:G.target||0,first,aid,champ:st[0].n,drvChamp:dch.n,drvMe:!!dch.me,best,table:st.map(t=>({n:t.n,c:t.c,pts:t.pts,me:t.id==='me'})),news:[],market:[]};
  G.off=off;
  // 나이와 계약
  G.drivers.forEach(d=>{ageDriver(d);d.contract=Math.max(0,(d.contract||1)-1)});
  const retire=[];G.drivers=G.drivers.filter(d=>{if(d.age>=39){retire.push(d.n);return false}return true});
  retire.forEach(n=>off.news.push(`${n} 선수가 은퇴했습니다.`));
  const pool=[];
  G.ai.forEach((t,ti)=>t.drivers.forEach((d,i)=>{ageDriver(d);d.contract=Math.max(0,(d.contract||1)-1);
    if(d.age>=38||(d.age>=36&&Math.random()<.4)){const nr=makeRookie(G,ti<4);off.news.push(`${t.n}의 ${d.n} 은퇴, 신인 ${nr.n} 합류`);t.drivers[i]=nr;return}
    if(d.contract===0)pool.push({...d,fromTeam:t.id,fromSlot:i,cost:driverValue(d),fromName:t.n})}));
  pool.sort((a,b)=>b.pace-a.pace);
  const mk=pool.slice(0,5);
  for(let i=0;i<3;i++){const r=makeRookie(G,false);r.contract=0;mk.push({...r,cost:driverValue(r),fromName:'신인'})}
  off.market=mk;off.market.sort((a,b)=>b.cost-a.cost);
  // 내 드라이버 재계약 금액
  off.renew={};G.drivers.forEach(d=>{const sp=ds.find(x=>x.id===d.id),hot=driverValue(d)>=42||(sp&&sp.pts>=30);off.renew[d.id]={cost:Math.round(driverValue(d)*(hot?1.2:1)),hot}});
  // 규정과 전력
  const rule=RULES[irand(0,RULES.length-1)];G.rule=rule;off.rule=rule;
  const before={...G.car};
  Object.keys(G.car).forEach(k=>{G.car[k]=Math.max(55,G.car[k]-(G.car[k]-58)*.22-1-(rule[k==='engine'?'engine':k==='aero'?'aero':k==='dur'?'dur':'_']||0))});
  off.carBefore=before;off.carAfter={...G.car};
  G.ai.forEach(t=>{['engine','aero','chassis','dur'].forEach(k=>{t[k]=clamp(t[k]-(t[k]-72)*.14+rand(-1,2.2)-(k===('engine')&&rule.engine?rule.engine:k==='aero'&&rule.aero?rule.aero:k==='dur'&&rule.dur?rule.dur:0),58,97)})});
  const shift=[...G.ai].sort(()=>Math.random()-.5);
  if(rank<=3){const push=rank===1?rand(2,3.5):rand(.5,1.5);G.ai.slice(0,5).forEach(t=>['engine','aero','chassis'].forEach(k=>t[k]=Math.min(97,t[k]+push)))}

function startSeason(){

  // 시장에 남은 드라이버는 원래 팀과 재계약

  G.news=[`시즌 ${G.season} 개막! 규정: ${off.rule.n}. 시즌 목표는 팀 순위 ${G.target}위 이내입니다.`];

      d.morale=clamp(c.d.morale+(pts?5:0)+(c.dnf?-3:1)+G.fac.sim*1.5,20,100);}
  });
  const miles=[];MILES.forEach(m=>{if(!G.miles[m.id]&&m.test(bestPos)){G.miles[m.id]=true;earned+=m.bonus;miles.push(m)}});
  G.budget+=earned;
  G.career.races++;G.results.push({track:R.track.name,best:bestPos,pts:ptsGot});
  G.round++;
  // AI 개발 + 내 프로젝트 정산
  G.ai.forEach((t,i)=>{for(let k=0;k<2;k++){const key=['engine','aero','chassis','dur'][irand(0,3)];t[key]=Math.min(97,t[key]+rand(.1,.45)+i*.03)}});
  const news=[];
  G.projects=G.projects.filter(p=>{if(p.due<=G.round){const m=projMeta[p.kind],ok=p.ok!=null?p.ok:p.gain>=m.gain,from=Math.round(G.car[p.part]);G.car[p.part]=Math.min(99,G.car[p.part]+p.gain);G.pop=G.pop||[];G.pop.push({part:p.part,kind:p.kind,ok,gain:p.gain,from,to:Math.round(G.car[p.part])});news.push(ok?`✓ ${PARTS[p.part].n} ${m.n} 성공: +${p.gain}`:`✕ ${PARTS[p.part].n} ${m.n} 실패: +${p.gain}만 남았습니다`);return false}return true});
  miles.forEach(m=>{const pt=PATTERNS.find(p=>p.unlock===m.id);if(pt)news.unshift(`✓ 새 도장 잠금 해제: ${pt.n}`);news.unshift(`✓ ${m.n} 달성! 스폰서 보너스 ${m.bonus}억`)});
  G.news=news;G.dot=G.dot||{};if(news.some(n=>/개발|도장/.test(n)))G.dot.garage=true;
  lastResult={rows,earned,ptsGot,bestPos,track:R.track,fast:R.fast&&R.cars[R.fast.id],fastT:R.fast&&R.fast.t,miles};
  save();R=null;renderResult();
}

/* ---------- 결과·시즌 종료 ---------- */
function showResearchPop(){
  if(!G||!G.pop||!G.pop.length||$('#resPop'))return;
  const list=G.pop,w=document.createElement('div');w.className='pop-wrap';w.id='resPop';
  const good=list.filter(p=>p.ok).length,head=good===list.length?(list.length>1?'연구가 모두 성공했습니다':'연구가 성공했습니다'):good===0?(list.length>1?'연구가 모두 실패했습니다':'연구가 실패했습니다'):'연구 결과가 나왔습니다';
  w.innerHTML=`<div class="pop-card" role="dialog" aria-modal="true" aria-labelledby="popT"><span class="lab">라운드 ${G.round} 연구 결과</span><h2 id="popT">${head}</h2>
    <div class="pop-list">${list.map(p=>`<div class="pop-row ${p.ok?'ok':'no'}"><span class="pop-mark" aria-hidden="true">${p.ok?'✓':'✕'}</span><div><strong>${PARTS[p.part].n} ${projMeta[p.kind].n}</strong><span>${p.ok?'성공':'실패'} · 능력치 ${p.from} → ${p.to}</span></div><b>+${p.gain}</b></div>`).join('')}</div>
    <div class="pop-btns"><button class="btn" id="popGarage">차고로 가기</button><button class="btn pri" id="popOk">확인</button></div></div>`;
  document.body.appendChild(w);
  const close=()=>{G.pop=[];save();w.remove()};
  $('#popOk',w).onclick=close;
  $('#popGarage',w).onclick=()=>{close();if(G.dot)G.dot.garage=false;go(()=>{renderHub();HT='garage';drawHubTab()})};
  $('#popOk',w).focus();
}
function renderResult(){
  const r=lastResult,w=r.rows[0].c;
  const line=r.rows.filter(x=>x.c.mine);
  $('#app').onclick=null;
  $('#app').innerHTML=`<div class="scroll"><div class="wrap">
  <header class="res-head"><div><span class="lab">라운드 ${G.round} 결과</span><h1>${esc(r.track.name)}</h1></div></header>
  <div class="sumrow">${line.map(x=>`<div><span class="lab">${x.c.d.code}</span><b>${x.c.dnf?'리타이어':'P'+x.pos}</b><span class="note">출발 P${x.c.grid} · 피트 ${x.c.pits}회${x.c.pen?' · 페널티 20초':''}</span></div>`).join('')}
    <div><span class="lab">획득 포인트</span><b data-count="${r.ptsGot}">${r.ptsGot}</b></div><div><span class="lab">상금·스폰서</span><b data-count="${r.earned}" data-suf="억">${r.earned}억</b></div></div>
  ${r.miles.map(m=>`<div class="news"><span class="good">${m.n} 달성! 스폰서 보너스 ${m.bonus}억이 들어왔습니다.</span></div>`).join('')}
  <div class="foot"><span class="note">우승 ${esc(w.d.n)}${r.fast?` · 가장 빠른 랩 ${r.fast.d.code} ${fmtLap(r.fastT)}`:''}</span><button class="btn pri" id="toHub">본부로</button></div>
  <section class="sec"><h2>최종 순위</h2><div class="tblw"><table class="tbl">${r.rows.map(x=>{const c=x.c;const gap=c.dnf?c.dnfWhy:x.pos===1?fmtLap(c.finishT).replace(/^(\d+):/,'$1:'):c.lap<w.lap?`+${w.lap-c.lap}랩`:'+'+(c.finishT+(c.pen||0)-w.finishT-(w.pen||0)).toFixed(1);
    return `<tr class="${c.mine?'me':''}"><td class="num" style="width:26px">${x.pos}</td><td><i class="tick" style="background:${c.mine?G.team.c1:c.team.c};margin-right:7px;vertical-align:-2px"></i>${esc(c.d.n)}</td><td class="tm">${esc(c.mine?G.team.name:c.team.n)}</td><td class="num">${gap}${c.pen?' (P)':''}</td><td class="r">${x.pts||''}</td></tr>`}).join('')}</table></div></section>
  </div></div>`;
  $('#toHub').onclick=()=>go(renderHub);
  setTimeout(showResearchPop,RM?0:450);
}
function startCreate(){
  C={name:'블랙스톤 레이싱',num:27,c1:PRIMARY[4],c2:SECOND[1],picks:['c4','c2'],anim:RM?'':'drive'};
  renderCreate();
}
let INTRO=null;
function closeIntro(){
  if(!INTRO)return;
  INTRO.stop=true;if(INTRO.ro)INTRO.ro.disconnect();
  if(S3D){S3D.dispose();S3D=null}
  R=null;P=null;G=INTRO.saved;INTRO=null;
}
function renderIntro(){
  const saved=G,done=saved&&saved.round>=TRACKS.length;
  if(!saved)G=ensureG(newGame({name:'데모',c1:PRIMARY[4],c2:SECOND[0],num:27},[CANDIDATES[3],CANDIDATES[1]]));
  setTeamVars(G.team.c1,G.team.c2);
  $('#app').onclick=null;
  $('#app').innerHTML=`<div class="intro" id="introBox"><canvas id="iGl" aria-hidden="true"></canvas><canvas id="iHud" aria-hidden="true"></canvas><div class="i-shade"></div>
    <div class="i-panel"><span class="i-en">PIT WALL GRAND PRIX</span><h1>피트월<br>그랑프리</h1><div class="i-chk" aria-hidden="true"></div>
      <div class="i-go"><button class="btn pri" id="introGo">${saved?'이어서 하기':'시작하기'}</button>${saved?`<span class="i-save"><b>${esc(saved.team.name)}</b>${done?`시즌 ${saved.season} 종료`:`시즌 ${saved.season} · 라운드 ${saved.round+1}/${TRACKS.length}`}</span>`:''}</div><div class="i-acc" data-acc hidden></div></div></div>`;
  INTRO={saved,stop:false};
  renderAccount();
  const me=INTRO;
  $('#introGo').onclick=()=>go(()=>{closeIntro();G?renderHub():startCreate()});
  if(!webglOK())return;
  setTimeout(()=>{
    if(INTRO!==me)return;
    try{
      const pick=[1,10,5,7][Math.floor(Math.random()*4)];
      preparePre(TRACKS[pick]);P.plan=null;P.falseRain=0;P.tyres=['M','M'];
      R=makeRace(P,true);R.speedKey=1;R.lightsDone=true;R.scripted=0;
      for(let k=0;k<160;k++)step(R,.2);
      S3D=createScene(R,$('#iGl'),$('#iHud'));S3D.S.noHud=true;S3D.S.orb.zoom=1.2;
      const box=$('#introBox'),rs=()=>{const q=box.getBoundingClientRect();if(q.width>0&&q.height>0&&S3D)S3D.resize(q.width,q.height)};rs();
      if(window.ResizeObserver){me.ro=new ResizeObserver(rs);me.ro.observe(box)}
      let last=performance.now(),acc=0;
      const loop=now=>{
        if(me.stop||!R||!S3D)return;
        const dt=Math.min(.1,(now-last)/1000);last=now;
        acc+=dt*3.2;let g=0;while(acc>=.2&&g<20&&!R.finished){step(R,.2);acc-=.2;g++}
        if(!RM)S3D.S.orb.yaw+=dt*.035;
        S3D.render(now,acc);requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }catch(e){console.error(e)}
  },30);
}
function start(data){
  G=ensureG((data&&data.G)||load());
  if(data&&data.G)renderHub();else renderIntro();
  initCloud();
}
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
